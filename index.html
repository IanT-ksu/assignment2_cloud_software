<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Garden</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imgs/icon.png"> <!--Icon created by Magnific-->
</head>

<body>
    <div class="header">
        <div class="nav-title">
            <h1>Welcome to Cloud Garden</h1>
        </div>
    </div>

    <div>
        <form class="user-form" id="submitForm" method="post" action="response.php">
            <fieldset>
                <legend>Select which flower you would like to plant in the garden:</legend>
                <div class="columns">
                    <div class="columns-left">
                        <br>
                        <div>
                            <label for="username">Enter your name:</label>
                            <input type="text" name="username" id="data" required>

                        </div>
                        <br>
                        <div>
                            <img src="/imgs/Rose.jpg" alt="Rose Picture">
                            <input type="radio" id="flower_rose" name="flower" value="Rose">
                            <label for="flower_rose">Rose</label>
                        </div>

                        <div>
                            <img src="/imgs/Hydrangea.jpg" alt="Hydrangea Picture">
                            <input type="radio" id="flower_hydrangea" name="flower" value="Hydrangea">
                            <label for="flower_hydrangea">Hydrangea</label>
                        </div>

                        <div>
                            <img src="/imgs/Orchid.jpg" alt="Orchid Picture">
                            <input type="radio" id="flower_orchid" name="flower" value="Orchid">
                            <label for="flower_orchid">Orchid</label>
                        </div>

                        <div>
                            <img src="/imgs/Sunflower.jpg" alt="Sunflower Picture">
                            <input type="radio" id="flower_sunflower" name="flower" value="Sunflower">
                            <label for="flower_sunflower">Sunflower</label>
                        </div>

                        <div>
                            <img src="/imgs/Petunia.jpg" alt="Petunia Picture">
                            <input type="radio" id="flower_petunia" name="flower" value="Petunia">
                            <label for="flower_petunia">Petunia</label>
                        </div>

                        <div>
                            <img src="/imgs/Daisy.jpg" alt="Daisy Picture">
                            <input type="radio" id="flower_daisy" name="flower" value="Daisy">
                            <label for="flower_daisy">Daisy</label>
                        </div>

                        <div>
                            <img src="/imgs/Pansy.jpg" alt="Pansy Picture">
                            <input type="radio" id="flower_pansy" name="flower" value="Pansy">
                            <label for="flower_pansy">Pansy</label>
                        </div>

                        <div>
                            <img src="/imgs/Zinnia.jpg" alt="Zinnia Picture">
                            <input type="radio" id="flower_zinnia" name="flower" value="Zinnia">
                            <label for="flower_zinnia">Zinnia</label>
                        </div>

                        <div class="form-btns">
                            <button type="submit">Plant</button>
                            <button type="reset">Clear</button>
                        </div>
                    </div>
                    <div class="column-right">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                    </div>

                    <div class="column-right">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                        <img id="planted" src="/imgs/icon.png" alt="Planted flower picture">
                    </div>
                </div>
            </fieldset>
        </form>
    </div>

    <p id="result"></p>

    <fieldset class="footer">
        <legend>Below is the number of times each flower has been planted:</legend>
        <p id="stats">
            Rose: 0
            <br>
            Hydrangea: 0
            <br>
            Orchid: 0
            <br>
            Sunflower: 0
            <br>
            Petunia: 0
            <br>
            Daisy: 0
            <br>
            Pansy: 0
            <br>
            Zinnia: 0
            <br>
        </p>
    </fieldset>

</body>

</html>
